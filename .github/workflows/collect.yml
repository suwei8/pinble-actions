name: 每日增量采集

on:
  schedule:
    # GitHub Actions 的 cron 只认 UTC; 高负载时延迟可达数小时, 故用密集触发网对冲
    # 时段一: 北京 17:01-19:30 每10分钟一次采集试机号 (采集幂等, 重复无妨)
    - cron: '1,11,21,31,41,51 9 * * *'
    - cron: '5,15,25,35,45,55 10 * * *'
    - cron: '5,15,25 11 * * *'
    # 时段二: 北京 21:15-23:00 每10分钟一次采集开奖号
    - cron: '20,30,40,50 13 * * *'
    - cron: '0,10,20,30,40,50 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      tg_test:
        description: '强制发送当前试机号 TG 通知(跳过入库去重, 测试/重发用)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 供心跳写回本仓(防 schedule 60 天休眠)

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PINBLE_LOTTERY_ID: ${{ secrets.PINBLE_LOTTERY_ID }}
      PINBLE_HDSN: ${{ secrets.PINBLE_HDSN }}
      PINBLE_GLOBAL_ID: ${{ secrets.PINBLE_GLOBAL_ID }}
      PINBLE_GLOBAL_VD: ${{ secrets.PINBLE_GLOBAL_VD }}
      PINBLE_GLOBAL_UD: ${{ secrets.PINBLE_GLOBAL_UD }}
      PINBLE_PROG_VER: ${{ secrets.PINBLE_PROG_VER }}

    steps:
      - name: 检出本仓(供心跳写回)
        uses: actions/checkout@v5

      - name: 检出数据仓
        uses: actions/checkout@v5
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: main
          ref: main
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: main/requirements*.txt

      - name: 安装依赖
        run: pip install -r main/requirements.txt -r main/requirements-dev.txt

      - name: 单元测试
        run: cd main && python -m pytest

      - name: 环境自检
        run: |
          test -n "$PINBLE_HDSN" || { echo "缺少 Secret: PINBLE_HDSN"; exit 1; }
          test -f main/data/k3_full_history.csv || { echo "缺少主数据集"; exit 1; }
          echo "主数据集行数: $(( $(wc -l < main/data/k3_full_history.csv) - 1 ))"

      - name: 增量采集(合并进 k3_full_history.csv)
        id: collect
        run: cd main && python -m collector.main

      - name: 回写数据仓
        id: publish
        run: |
          cd main
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --name-only -- data/k3_full_history.csv | grep -q .; then
            master_updated=true
          else
            master_updated=false
          fi
          if git diff --cached --quiet; then
            echo "本次无数据变更，跳过提交"
            exit 0
          fi
          git commit -m "data: 增量采集 (3D试机号 ${{ steps.collect.outputs.issue }}=${{ steps.collect.outputs.sjcode }} / P3试机号 ${{ steps.collect.outputs.p3_issue }}=${{ steps.collect.outputs.p3_sjcode }} / 3D新增${{ steps.collect.outputs.added }} P3新增${{ steps.collect.outputs.p3_added }} / 补开奖号 3D:${{ steps.collect.outputs.filled_kj }} P3:${{ steps.collect.outputs.p3_filled_kj }})"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              if [ "$master_updated" = true ]; then
                echo "master_changed=true" >> "$GITHUB_OUTPUT"
                echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep $((i * 15))
          done
          exit 1

      - name: 通知 3dtong-v2 启动事前预测（只发送数据提交 SHA，不发送 CSV）
        if: steps.publish.outputs.master_changed == 'true'
        continue-on-error: true   # dispatch token 失效不应掐死后续 TG 通知
        env:
          PREDICT_DISPATCH_TOKEN: ${{ secrets.PREDICT_DISPATCH_TOKEN }}
          SOURCE_COMMIT: ${{ steps.publish.outputs.source_commit }}
        run: |
          if [ -z "$PREDICT_DISPATCH_TOKEN" ]; then
            echo "::warning::未设置 PREDICT_DISPATCH_TOKEN：采集已回写，事件触发未激活，目标仓继续使用定时兜底。"
            exit 0
          fi
          payload=$(python - <<'PY'
          import json,os,re
          sha=os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[a-f0-9]{40}",sha):
              raise SystemExit("invalid source commit SHA")
          print(json.dumps({"event_type":"pinble_history_updated",
                            "client_payload":{"source_commit":sha}}))
          PY
          )
          curl --fail --silent --show-error --retry 3 --retry-delay 4 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PREDICT_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/suwei8/3dtong-v2/dispatches" \
            -d "$payload"
          echo "通知已发送到 3dtong-v2 (source commit: $SOURCE_COMMIT)"

      # TG 去重依据: 仅当本次运行真正写入新数据时推送
      #   {,p3_}added>0     -> 新期行入库(试机号通常随新行到达)
      #   {,p3_}filled_sj>0 -> 往已有行补写试机号
      #   {,p3_}filled_kj>0 -> 往已有行补写开奖号
      # 备份时段重跑时三者均为 0, 不会重复推送
      - name: TG 通知（试机号 / 开奖号命中结果）
        if: steps.collect.outcome == 'success' && (inputs.tg_test == true || steps.collect.outputs.added != '0' || steps.collect.outputs.filled_sj != '0' || steps.collect.outputs.filled_kj != '0' || steps.collect.outputs.p3_added != '0' || steps.collect.outputs.p3_filled_sj != '0' || steps.collect.outputs.p3_filled_kj != '0')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE: ${{ steps.collect.outputs.issue }}
          SJCODE: ${{ steps.collect.outputs.sjcode }}
          ADDED: ${{ steps.collect.outputs.added }}
          FILLED_SJ: ${{ steps.collect.outputs.filled_sj }}
          FILLED_KJ: ${{ steps.collect.outputs.filled_kj }}
          P3_ISSUE: ${{ steps.collect.outputs.p3_issue }}
          P3_SJCODE: ${{ steps.collect.outputs.p3_sjcode }}
          P3_ADDED: ${{ steps.collect.outputs.p3_added }}
          P3_FILLED_SJ: ${{ steps.collect.outputs.p3_filled_sj }}
          P3_FILLED_KJ: ${{ steps.collect.outputs.p3_filled_kj }}
        run: |
          if [ "${{ inputs.tg_test }}" = "true" ]; then
            export ADDED=1 P3_ADDED=1
            echo "tg_test: 强制发送当前试机号通知(added=0 也发)"
          fi
          python3 - <<'PY'
          import csv, os, sys
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat:
              print("::warning::未设置 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID，跳过 TG 通知")
              sys.exit(0)

          def prediction(issue, ledger):
              """topk_ledger 中该期预测; 返回 (独胆, 二码, 三码, 三码集合)"""
              if not os.path.exists(ledger):
                  return "—", "—", "—", set()
              with open(ledger, encoding="utf-8-sig") as f:
                  for row in csv.DictReader(f):
                      if row["target_issue"] == str(issue):
                          picks = {x for x in row["top3"].split("|") if x}
                          return (row["top1"].replace("|", "、"),
                                  row["top2"].replace("|", "、"),
                                  row["top3"].replace("|", "、"),
                                  picks)
              return "—", "—", "—", set()

          def hit_count(code, picks):
              """三码集合中实际出现的不同数字个数"""
              return len(set(code) & picks)

          def header(issue, label, ledger):
              t1, t2, t3, _ = prediction(issue, ledger)
              return (f"拼搏 {issue}期预测命中结果({label})\n"
                      f"独胆：{t1}\n二码：{t2}\n三码：{t3}")

          def sj_msg(env_issue, env_code, env_filled, env_added, label, ledger):
              """试机号入库消息: 新行自带(added>0)或往已有行补写(filled_sj>0)"""
              if (os.environ.get(env_filled, "0") == "0"
                      and os.environ.get(env_added, "0") == "0"):
                  return None
              if not os.environ.get(env_code):
                  return None
              issue, code = os.environ[env_issue], os.environ[env_code]
              picks = prediction(issue, ledger)[3]
              return (f"{header(issue, label, ledger)}\n\n"
                      f"拼搏试机号：{code}\n命中：{hit_count(code, picks)}码")

          def kj_msg(env_filled, env_added, env_issue, csv_path, label, ledger, kj_label):
              """开奖号入库消息: 补写(filled_kj>0)取最新开奖行;
              新行自带开奖号(added>0)则限定该新增期"""
              filled = os.environ.get(env_filled, "0") != "0"
              if not filled and os.environ.get(env_added, "0") == "0":
                  return None
              target_issue = os.environ.get(env_issue, "")
              with open(csv_path, encoding="utf-8-sig") as f:
                  for row in csv.DictReader(f):  # 主表按期号倒序
                      code = row["KaiJiang"].strip()
                      if not code:
                          continue
                      if not filled and row["Issue"] != target_issue:
                          continue
                      issue = row["Issue"]
                      picks = prediction(issue, ledger)[3]
                      return (f"{header(issue, label, ledger)}\n\n"
                              f"{kj_label}：{code}\n命中：{hit_count(code, picks)}码")
              return None

          K3_LEDGER, P3_LEDGER = "main/forward/topk_ledger.csv", "main/forward/p3/topk_ledger.csv"
          messages = [m for m in (
              sj_msg("ISSUE", "SJCODE", "FILLED_SJ", "ADDED", "福彩3D", K3_LEDGER),
              sj_msg("P3_ISSUE", "P3_SJCODE", "P3_FILLED_SJ", "P3_ADDED", "排列3", P3_LEDGER),
              kj_msg("FILLED_KJ", "ADDED", "ISSUE", "main/data/k3_full_history.csv", "福彩3D", K3_LEDGER, "福彩开奖号"),
              kj_msg("P3_FILLED_KJ", "P3_ADDED", "P3_ISSUE", "main/data/p3_full_history.csv", "排列3", P3_LEDGER, "排列3开奖号"),
          ) if m]

          for msg in messages:
              resp = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat, "text": msg},
                  timeout=15,
              )
              resp.raise_for_status()
              print("TG 已发送:", msg.replace("\n", " / "))
          PY

      - name: 心跳(防 schedule 休眠)
        if: always()
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git diff --cached --quiet || { git commit -m "chore: heartbeat" && git push; }
