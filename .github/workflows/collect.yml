name: 每日增量采集

on:
  schedule:
    # GitHub Actions 的 cron 只认 UTC；17:40 北京时间 = 09:40 UTC
    # 后两条为冗余备份: GitHub schedule 在高负载时会延迟/丢弃触发, 采集幂等故可安全重复
    - cron: '40 9 * * *'
    - cron: '10 10 * * *'   # 备份① 北京 18:10
    - cron: '40 10 * * *'   # 备份② 北京 18:40
  workflow_dispatch:

permissions:
  contents: write   # 供心跳写回本仓(防 schedule 60 天休眠)

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PINBLE_LOTTERY_ID: ${{ secrets.PINBLE_LOTTERY_ID }}
      PINBLE_HDSN: ${{ secrets.PINBLE_HDSN }}
      PINBLE_GLOBAL_ID: ${{ secrets.PINBLE_GLOBAL_ID }}
      PINBLE_GLOBAL_VD: ${{ secrets.PINBLE_GLOBAL_VD }}
      PINBLE_GLOBAL_UD: ${{ secrets.PINBLE_GLOBAL_UD }}
      PINBLE_PROG_VER: ${{ secrets.PINBLE_PROG_VER }}

    steps:
      - name: 检出本仓(供心跳写回)
        uses: actions/checkout@v5

      - name: 检出数据仓
        uses: actions/checkout@v5
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: main
          ref: main
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: main/requirements*.txt

      - name: 安装依赖
        run: pip install -r main/requirements.txt -r main/requirements-dev.txt

      - name: 单元测试
        run: cd main && python -m pytest

      - name: 环境自检
        run: |
          test -n "$PINBLE_HDSN" || { echo "缺少 Secret: PINBLE_HDSN"; exit 1; }
          test -f main/data/k3_full_history.csv || { echo "缺少主数据集"; exit 1; }
          echo "主数据集行数: $(( $(wc -l < main/data/k3_full_history.csv) - 1 ))"

      - name: 增量采集(合并进 k3_full_history.csv)
        id: collect
        run: cd main && python -m collector.main

      - name: 回写数据仓
        id: publish
        run: |
          cd main
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --name-only -- data/k3_full_history.csv | grep -q .; then
            master_updated=true
          else
            master_updated=false
          fi
          if git diff --cached --quiet; then
            echo "本次无数据变更，跳过提交"
            exit 0
          fi
          git commit -m "data: 增量采集 (试机号 ${{ steps.collect.outputs.issue }}=${{ steps.collect.outputs.sjcode }} / 新增 ${{ steps.collect.outputs.added }} 期 / 补开奖号 ${{ steps.collect.outputs.filled_kj }} 期)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              if [ "$master_updated" = true ]; then
                echo "master_changed=true" >> "$GITHUB_OUTPUT"
                echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep $((i * 15))
          done
          exit 1

      - name: 通知 3dtong-v2 启动事前预测（只发送数据提交 SHA，不发送 CSV）
        if: steps.publish.outputs.master_changed == 'true'
        env:
          PREDICT_DISPATCH_TOKEN: ${{ secrets.PREDICT_DISPATCH_TOKEN }}
          SOURCE_COMMIT: ${{ steps.publish.outputs.source_commit }}
        run: |
          if [ -z "$PREDICT_DISPATCH_TOKEN" ]; then
            echo "::warning::未设置 PREDICT_DISPATCH_TOKEN：采集已回写，事件触发未激活，目标仓继续使用定时兜底。"
            exit 0
          fi
          payload=$(python - <<'PY'
          import json,os,re
          sha=os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[a-f0-9]{40}",sha):
              raise SystemExit("invalid source commit SHA")
          print(json.dumps({"event_type":"pinble_history_updated",
                            "client_payload":{"source_commit":sha}}))
          PY
          )
          curl --fail --silent --show-error --retry 3 --retry-delay 4 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PREDICT_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/suwei8/3dtong-v2/dispatches" \
            -d "$payload"
          echo "通知已发送到 3dtong-v2 (source commit: $SOURCE_COMMIT)"

      - name: 心跳(防 schedule 休眠)
        if: always()
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git diff --cached --quiet || { git commit -m "chore: heartbeat" && git push; }
