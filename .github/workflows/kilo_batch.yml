name: Kilo批量盲测驱动(零TG·全自动)

on:
  workflow_dispatch:
    inputs:
      start:
        description: 起始期号(含)
        required: true
      end:
        description: 结束期号(含)
        required: true
      csv:
        description: 数据CSV(需覆盖到 end-1 期)
        required: false
        default: 'experiments/test_data/k3_to2026303.csv'
      neg:
        description: 负向杀号模式(true/false)
        required: false
        default: 'true'
      killn:
        description: 负向排除注数(留空=200→大底800)
        required: false
        default: '200'

permissions:
  contents: read
  actions: write   # GITHUB_TOKEN dispatch其他workflow所需

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - name: 逐期dispatch+收判决
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CSV="${{ inputs.csv }}"
          NEG="${{ inputs.neg }}"
          KN="${{ inputs.killn }}"
          [ -z "$KN" ] && KN=200
          for P in $(seq ${{ inputs.start }} ${{ inputs.end }}); do
            U=$((P-1))
            ACT=$(awk -F, -v p=$P 'NR>1 {gsub(/"/,"",$1); if($1+0==p){gsub(/"/,"",$2);print $2;exit}}' "$CSV")
            if [ -z "$ACT" ]; then echo "[$P] 无实际号,跳过"; continue; fi
            echo "=== dispatch $P upto=$U actual=$ACT"
            gh workflow run kilo_dadi.yml -f csv="$CSV" -f upto="$U" -f actual="$ACT" \
              -f neg="$NEG" -f killn="$KN" -f notg=true
            sleep 15
            RID=$(gh run list --workflow kilo_dadi.yml -L 1 --json databaseId -q '.[0].databaseId')
            timeout 900 gh run watch "$RID" --interval 30 > /dev/null || true
            JID=$(gh api "repos/{owner}/{repo}/actions/runs/$RID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | test("aggregate|聚合")) | .id' | head -1)
            gh api "repos/{owner}/{repo}/actions/jobs/$JID/logs" 2>/dev/null \
              | grep -E '盲测判决|实际号加权排名|朴素基线|预测文件' | sed "s/^/[$P] /" | tee -a verdicts.txt
          done

      - name: 上传判决
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ inputs.start }}-${{ inputs.end }}
          path: verdicts.txt
          if-no-files-found: ignore
          retention-days: 30
