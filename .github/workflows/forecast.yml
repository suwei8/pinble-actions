name: 自动预测下一期试机号

on:
  workflow_dispatch:
  schedule:
    # 北京时间 18:05-次日03:35 每30分钟一次;forward_predict.py 幂等,无新期不产生变更
    # 避开整点/半点(github schedule 高负载时段易延迟/丢触发)
    - cron: '5,35 10-19 * * *'

concurrency:
  group: forward-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出数据仓
        uses: actions/checkout@v5
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: main
          ref: main

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: main/requirements.txt

      - name: 安装依赖
        run: pip install -r main/requirements.txt

      - name: 结算上一期并预注册下一期
        id: predict
        run: |
          cd main
          export SOURCE_BLOB_SHA=$(git ls-tree HEAD data/k3_full_history.csv | awk '{print $3}')
          OLD_TARGET=""
          if [ -f forward/topk_ledger.csv ]; then
            OLD_TARGET=$(tail -n 1 forward/topk_ledger.csv | cut -d, -f1)
          fi
          python forward_predict.py > /tmp/predict.log 2>&1
          cat /tmp/predict.log
          NEW_TARGET=""
          if [ -f forward/topk_ledger.csv ]; then
            NEW_TARGET=$(tail -n 1 forward/topk_ledger.csv | cut -d, -f1)
          fi
          if [ -n "$NEW_TARGET" ] && [ "$OLD_TARGET" != "$NEW_TARGET" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "target=$NEW_TARGET" >> "$GITHUB_OUTPUT"
            echo "top1=$(tail -n 1 forward/topk_ledger.csv | cut -d, -f5)" >> "$GITHUB_OUTPUT"
            echo "top2=$(tail -n 1 forward/topk_ledger.csv | cut -d, -f6)" >> "$GITHUB_OUTPUT"
            echo "top3=$(tail -n 1 forward/topk_ledger.csv | cut -d, -f7)" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 回写数据仓
        run: |
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md forward/
          if git diff --cached --quiet; then
            echo "无数据或预测变化，跳过提交"
            exit 0
          fi
          TARGET=$(python - <<'PY'
          import csv
          with open("forward/topk_ledger.csv", encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          print(rows[-1]["target_issue"])
          PY
          )
          git commit -m "forecast: preregister issue $TARGET"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: 发送预测到微信
        if: steps.predict.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          WKY_API_TOKEN: ${{ secrets.WKY_API_TOKEN }}
          TARGET: ${{ steps.predict.outputs.target }}
          TOP1: ${{ steps.predict.outputs.top1 }}
          TOP2: ${{ steps.predict.outputs.top2 }}
          TOP3: ${{ steps.predict.outputs.top3 }}
        run: |
          if [ -z "$WKY_API_TOKEN" ]; then
            echo "::warning::未设置 Secret WKY_API_TOKEN，跳过微信推送（预测已回写数据仓）"
            exit 0
          fi
          python3 -c "import json,os; target=os.environ['TARGET']; top1=os.environ['TOP1']; top2=os.environ['TOP2'].replace('|','、'); top3=os.environ['TOP3'].replace('|','、'); msg=f'试机号预测 {target}期\n独胆: {top1}\n二码: {top2}\n三码: {top3}'; payload={'actions':[{'type':'wechat_message','row':1,'text':msg}]}; open('/tmp/wx_payload.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False)); print(msg)"
          echo "正在推送..."
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 120 -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $WKY_API_TOKEN" "https://pa.555606.xyz/v1/notify" -d @/tmp/wx_payload.json
          echo ""
          echo "微信推送已发送"
